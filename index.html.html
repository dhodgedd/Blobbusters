let audioCtx = null;

let masterCompressor = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterCompressor = audioCtx.createDynamicsCompressor();
        masterCompressor.threshold.setValueAtTime(-14, audioCtx.currentTime);
        masterCompressor.knee.setValueAtTime(30, audioCtx.currentTime);
        masterCompressor.ratio.setValueAtTime(12, audioCtx.currentTime);
        masterCompressor.attack.setValueAtTime(0.003, audioCtx.currentTime);
        masterCompressor.release.setValueAtTime(0.25, audioCtx.currentTime);
        masterCompressor.connect(audioCtx.destination);

        musicGainNode = audioCtx.createGain();
        musicGainNode.gain.setValueAtTime(0.36, audioCtx.currentTime);
        musicGainNode.connect(masterCompressor);
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    if (!isAudioRunning && audioCtx) {
        startBGM();
        isAudioRunning = true;
    }
}

function startBGM() {
    function tick() {
        const profile = (state === 'START' || state === 'HANGAR' || state === 'INITIALS') 
            ? TITLE_AUDIO_PROFILE 
            : (SECTOR_AUDIO_PROFILES[currentSectorIdx] || SECTOR_AUDIO_PROFILES[0]);

        if (state === 'START' || state === 'HANGAR' || state === 'INITIALS' || ((state === 'PLAYING' || state === 'BOSS') && sectorIntroTimer <= 40)) {
            playDualSynthStep(profile, bgmStep);
            bgmStep = (bgmStep + 1) % profile.bass.length;
        }
        setTimeout(tick, profile.stepDuration * 1000);
    }
    tick();
}

function playDualSynthStep(profile, step) {
    if (!audioCtx || !musicGainNode) return;
    const now = audioCtx.currentTime;
    const isBossMode = state === 'BOSS';
    const isEnraged = isBossMode && boss.hp <= 8;
    const pitchMod = isBossMode ? (isEnraged ? 0.9 : 0.75) : 1.0;

    const bassFreq = profile.bass[step] * pitchMod;
    if (bassFreq > 0) {
        const bOsc = audioCtx.createOscillator();
        const bFilter = audioCtx.createBiquadFilter();
        const bGain = audioCtx.createGain();

        bOsc.type = 'sawtooth';
        bOsc.frequency.setValueAtTime(bassFreq, now);

        bFilter.type = 'lowpass';
        bFilter.frequency.setValueAtTime(profile.filterBase * (isBossMode ? 1.4 : 1.0), now);
        bFilter.frequency.exponentialRampToValueAtTime(90, now + profile.stepDuration * 0.9);

        bGain.gain.setValueAtTime(0.40, now);
        bGain.gain.exponentialRampToValueAtTime(0.001, now + profile.stepDuration * 0.95);

        bOsc.connect(bFilter);
        bFilter.connect(bGain);
        bGain.connect(musicGainNode);

        bOsc.start(now);
        bOsc.stop(now + profile.stepDuration);
    }

    const leadFreq = profile.lead[step] * pitchMod;
    if (leadFreq > 0) {
        const lOsc = audioCtx.createOscillator();
        const lGain = audioCtx.createGain();

        lOsc.type = profile.leadWave;
        lOsc.frequency.setValueAtTime(leadFreq, now);

        lGain.gain.setValueAtTime(0.24, now);
        lGain.gain.exponentialRampToValueAtTime(0.001, now + profile.stepDuration * 0.85);

        lOsc.connect(lGain);
        lGain.connect(musicGainNode);

        lOsc.start(now);
        lOsc.stop(now + profile.stepDuration * 0.9);
    }
}

function playVictoryFanfare() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const fanfareNotes = [

        { freq: 659.25, time: 0.15, dur: 0.14 },
        { freq: 783.99, time: 0.30, dur: 0.14 },
        { freq: 1046.50, time: 0.45, dur: 0.75 }

    fanfareNotes.forEach(note => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(note.freq, now + note.time);
        gain.gain.setValueAtTime(0.35, now + note.time);
        gain.gain.exponentialRampToValueAtTime(0.001, now + note.time + note.dur);
        osc.connect(gain);
        gain.connect(masterCompressor);
        osc.start(now + note.time);
        osc.stop(now + note.time + note.dur + 0.05);
    });
}

    chord.forEach((freq, idx) => {

function playBoom() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const dur = 0.35;
    const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(650, now);
    filter.frequency.linearRampToValueAtTime(40, now + dur);
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.40, now);
    gain.gain.linearRampToValueAtTime(0.001, now + dur);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(masterCompressor);
    noise.start(now);
}

const keys = {};
window.addEventListener('keydown', (e) => {
    initAudio();
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
    const k = e.key.toLowerCase();
    keys[k] = true;

    if (state === 'PLAYING' || state === 'BOSS') {
        if (k === 'arrowleft' || k === 'a') travelDir = -1;
        if (k === 'arrowright' || k === 'd') travelDir = 1;
    } else if (state === 'START') {
        if (k === 'h') {
            hasUnviewedShip = false;
            saveUnlocks();
            state = 'HANGAR';
        } else if (k === ' ' || k === 'z') {
            resetCampaign();
        }
    } else if (state === 'HANGAR') {
        if (k === 'arrowleft' || k === 'a') {
            selectedShipIdx = (selectedShipIdx - 1 + SHIPS.length) % SHIPS.length;
            playLaser();
        } else if (k === 'arrowright' || k === 'd') {
            selectedShipIdx = (selectedShipIdx + 1) % SHIPS.length;
            playLaser();
        } else if (k === ' ' || k === 'z') {
            if (SHIPS[selectedShipIdx].unlocked) {
                resetCampaign();
            } else {
                playHit();
            }
        } else if (k === 'escape' || k === 'h') {
            state = 'START';
        }
    } else if (state === 'INITIALS') {
        handleInitialsInput(k);
    } else if (state === 'GAMEOVER') {
        if (k === 'c') continueCurrentSector();
        if (k === 'h') {
            hasUnviewedShip = false;
            saveUnlocks();
            state = 'HANGAR';
        }
        if (k === ' ' || k === 'z') resetCampaign();
    } else if (state === 'VICTORY') {
        if (k === ' ' || k === 'z') advanceLoop();
    }
});
window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

const touchBtns = {
    up: { x: 45, y: 355, w: 60, h: 50, active: false, label: '▲' },
    down: { x: 45, y: 415, w: 60, h: 50, active: false, label: '▼' },
    flip: { x: 120, y: 385, w: 65, h: 60, active: false, label: 'FLIP' },
    fire: { x: 810, y: 375, w: 85, h: 85, active: false, label: 'FIRE' }
};

function handleTouch(e) {
    initAudio();
    const rect = canvas.getBoundingClientRect();
    const scaleX = WIDTH / rect.width;
    const scaleY = HEIGHT / rect.height;

    touchBtns.up.active = false;
    touchBtns.down.active = false;
    touchBtns.flip.active = false;
    touchBtns.fire.active = false;

    for (let i = 0; i < e.touches.length; i++) {
        const tx = (e.touches[i].clientX - rect.left) * scaleX;
        const ty = (e.touches[i].clientY - rect.top) * scaleY;

        if (state === 'START') {
            if (ty > 410) {
                hasUnviewedShip = false;
                saveUnlocks();
                state = 'HANGAR';
            } else resetCampaign();
            return;
        }
        if (state === 'HANGAR') {
            if (tx < WIDTH / 2) selectedShipIdx = (selectedShipIdx - 1 + SHIPS.length) % SHIPS.length;
            else selectedShipIdx = (selectedShipIdx + 1) % SHIPS.length;
            return;
        }
        if (state === 'GAMEOVER') {
            if (ty > 430) {
                hasUnviewedShip = false;
                saveUnlocks();
                state = 'HANGAR';
            } else if (ty < HEIGHT / 2) continueCurrentSector();
            else resetCampaign();
            return;
        }
        if (state === 'VICTORY') {
            advanceLoop();
            return;
        }

        for (const k in touchBtns) {
            const b = touchBtns[k];
            if (tx >= b.x && tx <= b.x + b.w && ty >= b.y && ty <= b.y + b.h) {
                b.active = true;
                if (k === 'flip' && (state === 'PLAYING' || state === 'BOSS')) {
                    travelDir = -travelDir;
                }
            }
        }
    }
}
canvas.addEventListener('touchstart', handleTouch, { passive: false });
canvas.addEventListener('touchmove', handleTouch, { passive: false });

// ==========================================
// GAME STATE VARIABLES
// ==========================================
const MUSHROOM_COLORS = ['#ff0055', '#00ff66', '#ffff00', '#ff00ff', '#00ffff', '#ff6600', '#9900ff'];
let state = 'START';

let campaignLoop = 1;
let currentSectorIdx = 0;
let score = 0;
let lives = 3;
let shroomsEliminated = 0;
let elitesEliminated = 0;
let clearTimer = 0;
let bossWarningTimer = 0;
let sectorIntroTimer = 0;

let comboCount = 0;
let comboTimer = 0;
let comboMultiplier = 1;

let scrollOffset = 5000;
let travelDir = 1;
let shakeTime = 0;
let shakeStrength = 0;

const saucer = {
    x: 280,
    y: 200,
    vy: 0,
    currentFacing: 1,
    cooldown: 0,
    doubleShotTimer: 0,
    speedTimer: 0,
    shieldActive: false,
    invulnerableTimer: 0,
    ghosts: []
};

const boss = {
    worldX: 0,
    x: 0,
    y: 130,
    baseY: 130,
    maxHp: 24,
    hp: 24,
    radius: 48,
    flashTimer: 0,
    fireTimer: 0,
    sporeTimer: 0
};

let bossBeams = [];
let bossSpores = [];
let alienBullets = [];
let mushrooms = [];
let rockets = [];
let aliens = [];
let powerups = [];
let goldenSpores = [];
let particles = [];
let stars = [];

let entryLetters = ['A', 'A', 'A'];
let entryPos = 0;

for (let i = 0; i < 90; i++) {
    stars.push({
        x: Math.random() * WIDTH,
        y: Math.random() * HEIGHT,
        size: Math.random() * 2 + 0.5,
        depth: Math.random() * 0.6 + 0.2
    });
}

function getForegroundTerrain(wx) {
    const sector = SECTORS[currentSectorIdx];
    const base = HEIGHT - 85;
    const amp = sector.hillRoughness;
    return base + Math.sin(wx * 0.005) * amp + Math.cos(wx * 0.016) * (amp * 0.5) + Math.sin(wx * 0.035) * 14;
}

function getBackgroundMountain(wx) {
    const base = HEIGHT - 140;
    return base + Math.sin(wx * 0.003) * 60 + Math.cos(wx * 0.008) * 40;
}

function triggerShake(strength, duration = 6) {
    shakeStrength = strength;
    shakeTime = duration;
}

function triggerShipUnlock(shipName) {
    hasUnviewedShip = true;
    unlockedShipName = shipName;
    shipUnlockAlertTimer = 180;
    playUnlockChime();
    saveUnlocks();
}

function registerHitScore(basePoints) {
    comboCount++;
    comboTimer = 150;
    if (comboCount >= 9) comboMultiplier = 4;
    else if (comboCount >= 6) comboMultiplier = 3;
    else if (comboCount >= 3) comboMultiplier = 2;
    else comboMultiplier = 1;

    score += basePoints * comboMultiplier;

    if (score >= 10000 && !SHIPS[1].unlocked) {
        SHIPS[1].unlocked = true;
        triggerShipUnlock(SHIPS[1].name);
    }
    if (score >= 25000 && !SHIPS[2].unlocked) {
        SHIPS[2].unlocked = true;
        triggerShipUnlock(SHIPS[2].name);
    }
}

function resetCampaign() {
    score = 0;
    campaignLoop = 1;
    const ship = SHIPS[selectedShipIdx];
    lives = ship.lives;
    loadSector(0);
    state = 'PLAYING';
}

function continueCurrentSector() {
    const ship = SHIPS[selectedShipIdx];
    lives = ship.lives;
    loadSector(currentSectorIdx);
    state = 'PLAYING';
}

function advanceLoop() {
    campaignLoop++;
    loadSector(0);
    state = 'PLAYING';
}

function loadSector(idx) {
    currentSectorIdx = idx;
    shroomsEliminated = 0;
    elitesEliminated = 0;
    clearTimer = 0;
    bossWarningTimer = 0;
    sectorIntroTimer = 160;
    comboCount = 0;
    comboTimer = 0;
    comboMultiplier = 1;

    travelDir = 1;
    saucer.currentFacing = 1;
    saucer.x = 280;
    saucer.y = 200;
    saucer.vy = 0;
    saucer.cooldown = 0;
    saucer.doubleShotTimer = 0;
    saucer.speedTimer = 0;
    saucer.shieldActive = SHIPS[selectedShipIdx].shieldOnSpawn;
    saucer.invulnerableTimer = 60;
    saucer.ghosts = [];

    rockets = [];
    mushrooms = [];
    aliens = [];
    powerups = [];
    goldenSpores = [];
    alienBullets = [];
    particles = [];
    bossBeams = [];
    bossSpores = [];

    bgmStep = 0;
    playVictoryFanfare();

    for (let x = scrollOffset - 800; x < scrollOffset + WIDTH + 800; x += 110 + Math.random() * 100) {
        spawnMushroom(x);
    }
    checkEliteSpawns();
}

function startBossEncounter() {
    state = 'BOSS';
    bossWarningTimer = 180;
    boss.hp = boss.maxHp;
    boss.worldX = scrollOffset + WIDTH * 0.75;
    boss.x = WIDTH * 0.75;
    boss.y = 130;
    boss.baseY = 130;
    boss.fireTimer = 70;
    boss.sporeTimer = 100;
    triggerShake(14, 20);
    playBoom();
}

function checkEliteSpawns() {
    const sector = SECTORS[currentSectorIdx];
    const loopQuota = sector.eliteQuota + (campaignLoop - 1);
    const elitesLeft = loopQuota - elitesEliminated;
    if (elitesLeft <= 0) return;

    if (sector.eliteType === 'megashroom') {
        const activeMegas = mushrooms.filter(m => m.isMega).length;
        if (activeMegas === 0) {
            const spawnX = travelDir === 1 ? scrollOffset + WIDTH + 250 : scrollOffset - 250;
            spawnMegaShroom(spawnX);
        }
    } else if (sector.eliteType === 'commander') {
        const activeCommanders = aliens.filter(a => a.isCommander).length;
        if (activeCommanders === 0) {
            spawnAlien(true);
        }
    }
}

function spawnMushroom(wx) {
    const roll = Math.random();
    let type = 'normal';
    if (roll < 0.08) type = 'double';
    else if (roll < 0.12) type = 'speed';
    else if (roll < 0.16) type = 'shield';

    mushrooms.push({
        worldX: wx,
        y: getForegroundTerrain(wx),
        type: type,
        isMega: false,
        hp: 1,
        flashTimer: 0,
        capColor: type === 'shield' ? '#00ff66' : (type === 'speed' ? '#00f7ff' : (type === 'double' ? '#ffe600' : MUSHROOM_COLORS[Math.floor(Math.random() * MUSHROOM_COLORS.length)])),
        stemColor: '#f2f2f2',
        scale: type !== 'normal' ? 1.25 : (0.8 + Math.random() * 0.5),
        radius: type !== 'normal' ? 20 : 16
    });
}

function spawnMegaShroom(wx) {
    mushrooms.push({
        worldX: wx,
        y: getForegroundTerrain(wx),
        type: 'mega',
        isMega: true,
        hp: 3,
        flashTimer: 0,
        capColor: '#ff0033',
        stemColor: '#fff',
        scale: 2.1,
        radius: 34
    });
}

function spawnAlien(isCommander = false) {
    const spawnAhead = travelDir === 1 ? scrollOffset + WIDTH + 120 : scrollOffset - 120;
    const altitude = isCommander 
        ? 40 + Math.random() * 140 
        : 35 + Math.random() * 200;

    aliens.push({
        worldX: spawnAhead,
        y: altitude,
        vx: -travelDir * (isCommander ? 2.4 : 1.8 + Math.random() * 1.6) * (1 + (campaignLoop - 1) * 0.1),
        baseY: altitude,
        bobOffset: Math.random() * 10,
        radius: isCommander ? 24 : 16,
        isCommander: isCommander,
        hp: isCommander ? 3 : 1,
        flashTimer: 0
    });
}

function createExplosion(x, y, color, count = 18) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4.5 + 1;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color: color,
            alpha: 1,
            size: Math.random() * 3 + 2,
            decay: Math.random() * 0.03 + 0.02
        });
    }
}

function hitPlayer() {
    if (saucer.invulnerableTimer > 0) return;

    if (saucer.shieldActive) {
        saucer.shieldActive = false;
        saucer.invulnerableTimer = 90;
        playShieldBreak();
        createExplosion(saucer.x, saucer.y, '#00ff66', 22);
        triggerShake(8, 10);
        return;
    }

    lives--;
    playBoom();
    createExplosion(saucer.x, saucer.y, '#00ffff', 25);
    createExplosion(saucer.x, saucer.y, '#ff00aa', 25);
    triggerShake(14, 18);

    if (lives <= 0) {
        triggerGameOver();
    } else {
        saucer.y = 190;
        saucer.vy = -3;
        saucer.invulnerableTimer = 130;
    }
}

// ==========================================
// REDESIGNED SHIPS DRAWING HELPER
// ==========================================
function drawSaucer(x, y, facingScale, tilt) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(facingScale, 1);
    ctx.rotate(tilt);

    if (saucer.invulnerableTimer > 0 && Math.floor(Date.now() / 80) % 2 === 0) {
        ctx.globalAlpha = 0.4;
    }

    const ship = SHIPS[selectedShipIdx];
    const auraColor = saucer.shieldActive ? '#00ff66' : (saucer.speedTimer > 0 ? '#00f7ff' : (saucer.doubleShotTimer > 0 ? '#ffea00' : '#00ffff'));

    if (ship.id === 'dart') {
        // ==========================================
        // 1. DART INTERCEPTOR (Sleek White/Cyan Fighter from Sheet 1)
        // Scaled up, arrow fuselage with twin outrigger pods
        // ==========================================
        ctx.shadowBlur = 14;
        ctx.shadowColor = auraColor;

        // Twin Side Booster Pods
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-12, -18, 14, 6);
        ctx.fillRect(-12, 12, 14, 6);

        ctx.fillStyle = '#00f7ff';
        ctx.fillRect(-16, -17, 4, 4);
        ctx.fillRect(-16, 13, 4, 4);

        // Swept Wing Pylons
        ctx.fillStyle = '#6600cc';
        ctx.beginPath();
        ctx.moveTo(-4, -12); ctx.lineTo(10, 0); ctx.lineTo(-4, 12);
        ctx.lineTo(-18, 16); ctx.lineTo(-14, 0); ctx.lineTo(-18, -16);
        ctx.closePath();
        ctx.fill();

        // Main Sleek Fuselage
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(28, 0);       // Long needle nose
        ctx.lineTo(6, -8);
        ctx.lineTo(-20, -7);
        ctx.lineTo(-16, 0);
        ctx.lineTo(-20, 7);
        ctx.lineTo(6, 8);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#220066';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Cyan Canopy
        ctx.fillStyle = auraColor;
        ctx.beginPath();
        ctx.ellipse(3, 0, 9, 3.8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Animated Thruster Plumes
        const flameLength = 10 + Math.random() * 6;
        ctx.fillStyle = '#ff6600';
        ctx.beginPath();
        ctx.moveTo(-16, -15); ctx.lineTo(-16 - flameLength * 0.7, -15); ctx.lineTo(-16, -13);
        ctx.moveTo(-16, 15);  ctx.lineTo(-16 - flameLength * 0.7, 15);  ctx.lineTo(-16, 13);
        ctx.moveTo(-20, -3);  ctx.lineTo(-20 - flameLength, 0);          ctx.lineTo(-20, 3);
        ctx.fill();

    } else if (ship.id === 'dreadnought') {
        // ==========================================
        // 2. TRIDENT DREADNOUGHT (Heavy Armored Cruiser from Sheet 2)
        // Imposing 3-prong forward hull, heavy armor plating
        // ==========================================
        ctx.shadowBlur = 16;
        ctx.shadowColor = auraColor;

        // Outer Gun / Armor Pods (Top & Bottom prongs)
        ctx.fillStyle = '#ff0055';
        ctx.fillRect(-18, -20, 32, 7);
        ctx.fillRect(-18, 13, 32, 7);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(14, -19, 6, 5);
        ctx.fillRect(14, 14, 6, 5);

        // Connective Wing Struts
        ctx.fillStyle = '#220044';
        ctx.fillRect(-12, -13, 24, 26);

        // Center Heavy Core Fuselage (Middle prong)
        ctx.fillStyle = '#f0f0f5';
        ctx.beginPath();
        ctx.moveTo(24, 0);
        ctx.lineTo(8, -10);
        ctx.lineTo(-24, -11);
        ctx.lineTo(-20, 0);
        ctx.lineTo(-24, 11);
        ctx.lineTo(8, 10);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#00f7ff';
        ctx.lineWidth = 1.8;
        ctx.stroke();

        // Heavy Inset Cockpit Grille
        ctx.fillStyle = auraColor;
        ctx.fillRect(-2, -5, 12, 10);
        ctx.fillStyle = '#000000';
        ctx.fillRect(2, -4, 2, 8);
        ctx.fillRect(6, -4, 2, 8);

        // Reinforced Armor Trim
        ctx.fillStyle = '#ffaa00';
        ctx.fillRect(-14, -8, 6, 16);

        // Triple Heavy Exhaust Fires
        const plume = 12 + Math.random() * 8;
        ctx.fillStyle = '#00f7ff';
        ctx.fillRect(-24 - plume * 0.6, -18, plume * 0.6, 3);
        ctx.fillRect(-24 - plume * 0.6, 15, plume * 0.6, 3);
        ctx.fillStyle = '#ffea00';
        ctx.fillRect(-26 - plume, -3, plume, 6);

    } else {
        // ==========================================
        // 3. ALPHA DISC (The Classic Saucer)
        // Retains the original rotating undercarriage lights
        // ==========================================
        ctx.shadowBlur = 15;
        ctx.shadowColor = auraColor;

        // Cockpit dome
        ctx.beginPath();
        ctx.arc(0, -5, 14, Math.PI, 0);
        ctx.fillStyle = auraColor;
        ctx.fill();

        // Disc Hull
        ctx.beginPath();
        ctx.ellipse(0, 2, 30, 11, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#ff00aa';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        // Saucer-exclusive running lights
        const groundUnder = getForegroundTerrain(saucer.x + scrollOffset);
        const altitude = groundUnder - (saucer.y + 12);
        const isTerrainWarning = altitude < 42;
        const t = Date.now() * 0.008;

        for (let i = -2; i <= 2; i++) {
            ctx.beginPath();
            ctx.arc(i * 9, 3, 2.2, 0, Math.PI * 2);
            ctx.fillStyle = isTerrainWarning 
                ? (Math.floor(Date.now() / 100) % 2 === 0 ? '#ff0033' : '#ffea00')
                : (Math.sin(t + i) > 0 ? '#ffff00' : '#33ff00');
            ctx.fill();
        }
    }

    // Emerald Energy Shield Bubble
    if (saucer.shieldActive) {
        ctx.save();
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#00ff66';
        ctx.strokeStyle = '#00ff66';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 0, ship.hitRadius + 18 + Math.sin(Date.now() * 0.01) * 2, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }

    ctx.restore();
}

// COHESIVE SOVEREIGN BOSS
function drawCyberSovereign(x, y, flashTimer, scale = 1.0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    const isFlashing = flashTimer > 0;
    const isEnraged = boss.hp <= 8;

    const t = Date.now() * (isEnraged ? 0.016 : 0.008);
    const tentacleColors = isEnraged 
        ? ['#ff0033', '#ff6600', '#ff0033', '#ff6600', '#ff0033']
        : ['#ff0033', '#0044ff', '#ffe600', '#0044ff', '#ff0033'];

    ctx.lineWidth = 4.5;
    ctx.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
        const ox = (i - 2) * 14;
        ctx.strokeStyle = tentacleColors[i];
        ctx.beginPath();
        ctx.moveTo(ox, 28);
        ctx.bezierCurveTo(
            ox + Math.sin(t + i) * (isEnraged ? 24 : 14), 52,
            ox - Math.sin(t + i) * (isEnraged ? 24 : 14), 68,
            ox + Math.sin(t + i) * 14, 88
        );
        ctx.stroke();
    }

    ctx.fillStyle = isFlashing ? '#ffffff' : (isEnraged ? '#7a001a' : '#8c1126');
    ctx.beginPath();
    ctx.moveTo(-16, -35);
    ctx.lineTo(16, -35);
    ctx.lineTo(10, -56);
    ctx.lineTo(-10, -56);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = isFlashing ? '#ffffff' : (isEnraged ? '#ff0033' : '#c41434');
    ctx.fillRect(-8, -62, 16, 12);
    ctx.fillStyle = '#ffe600';
    ctx.beginPath();
    ctx.arc(0, -62, 14, Math.PI, 0);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1.8;
    ctx.stroke();

    const hornColor = isFlashing ? '#ffffff' : (isEnraged ? '#4a0072' : '#0033b3');
    ctx.fillStyle = hornColor;
    ctx.shadowBlur = 14;
    ctx.shadowColor = isEnraged ? '#ff0055' : '#00f7ff';

    function drawSeamlessHorn() {
        ctx.beginPath();
        ctx.moveTo(-7, 12);
        ctx.quadraticCurveTo(-14, 0, -18, -8);
        ctx.arc(0, -8, 20, Math.PI * 0.9, Math.PI * 0.1, false);
        ctx.quadraticCurveTo(14, 0, 7, 12);
        ctx.closePath();
        ctx.fill();
    }

    ctx.save();
    ctx.translate(-38, -14);
    ctx.rotate(-0.45);
    drawSeamlessHorn();
    ctx.restore();

    ctx.save();
    ctx.scale(-1, 1);
    ctx.translate(-38, -14);
    ctx.rotate(-0.45);
    drawSeamlessHorn();
    ctx.restore();

    ctx.shadowBlur = isEnraged ? 35 : 22;
    ctx.shadowColor = isEnraged ? '#ff0033' : '#ffe600';

    const shellGrad = ctx.createRadialGradient(0, -6, 10, 0, 0, 48);
    shellGrad.addColorStop(0, isFlashing ? '#ffffff' : (isEnraged ? '#ff6600' : '#ffe033'));
    shellGrad.addColorStop(0.7, isFlashing ? '#ffffff' : (isEnraged ? '#cc1100' : '#d49b00'));
    shellGrad.addColorStop(1, isFlashing ? '#ffffff' : (isEnraged ? '#800000' : '#805d00'));
    ctx.fillStyle = shellGrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, 48, 41, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = '#220a00';
    ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 4, 38, Math.PI * 0.2, Math.PI * 0.8);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, -8, 34, Math.PI * 0.25, Math.PI * 0.75);
    ctx.stroke();

    ctx.fillStyle = '#ff0055';
    ctx.beginPath();
    ctx.ellipse(-14, 5, 14, 11, -0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-14, 5, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ff0055';
    ctx.beginPath();
    ctx.ellipse(14, 0, 16, 13, 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(14, 0, 8, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

// Clean glowing mushrooms (no yellow line)
function drawMushroom(x, y, scale, capColor, stemColor, type, isMega, flashTimer, hp) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    const isFlashing = flashTimer > 0;
    const finalCap = isFlashing ? '#ffffff' : capColor;

    if (isMega) {
        const pulse = Math.sin(Date.now() * 0.01) * 6;
        ctx.shadowBlur = 24 + pulse;
        ctx.shadowColor = '#ff0055';
    } else {
        ctx.shadowBlur = type !== 'normal' ? 18 : 10;
        ctx.shadowColor = finalCap;
    }

    ctx.fillStyle = isFlashing ? '#ffffff' : stemColor;
    ctx.fillRect(-4, -4, 8, 14);

    ctx.beginPath();
    ctx.arc(0, -4, 15, Math.PI, 0, false);
    ctx.fillStyle = finalCap;
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = type !== 'normal' || isMega ? '#000' : '#fff';
    ctx.beginPath();
    ctx.arc(-7, -10, 2, 0, Math.PI * 2);
    ctx.arc(0, -14, 2.5, 0, Math.PI * 2);
    ctx.arc(7, -10, 2, 0, Math.PI * 2);
    ctx.fill();

    if (isMega && hp > 0) {
        ctx.fillStyle = '#ffff00';
        for (let i = 0; i < hp; i++) {
            ctx.fillRect(-6 + i * 5, 12, 3.5, 3.5);
        }
    }
    ctx.restore();
}

function drawAlien(x, y, isCommander, flashTimer, hp) {
    ctx.save();
    ctx.translate(x, y);

    const isFlashing = flashTimer > 0;
    const bodyColor = isFlashing ? '#ffffff' : (isCommander ? '#9400d3' : '#1b5e20');
    const ringColor = isCommander ? '#ff00ff' : '#39ff14';

    ctx.shadowBlur = isCommander ? (25 + Math.sin(Date.now() * 0.015) * 8) : 12;
    ctx.shadowColor = ringColor;
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.arc(0, 0, isCommander ? 20 : 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = ringColor;
    ctx.lineWidth = isCommander ? 3.5 : 2;
    ctx.stroke();

    ctx.fillStyle = isCommander ? '#ffff00' : '#ff0033';
    ctx.beginPath();
    ctx.arc(0, 0, isCommander ? 7 : 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = ringColor;
    ctx.lineWidth = 2;
    const t = Date.now() * 0.01;
    const count = isCommander ? 4 : 3;
    for (let i = 0; i < count; i++) {
        const ox = (i - (count - 1) / 2) * 8;
        ctx.beginPath();
        ctx.moveTo(ox, 10);
        ctx.quadraticCurveTo(ox + Math.sin(t + i) * 6, 20, ox, 26);
        ctx.stroke();
    }

    if (isCommander && hp > 0) {
        ctx.fillStyle = '#00ffff';
        for (let i = 0; i < hp; i++) {
            ctx.fillRect(-7 + i * 6, -26, 4, 4);
        }
    }
    ctx.restore();
}

function drawPowerupOrb(x, y, type) {
    ctx.save();
    ctx.translate(x, y);

    let mainColor = '#ffe600';
    let label = '2X';
    if (type === 'speed') { mainColor = '#00f7ff'; label = 'S'; }
    if (type === 'shield') { mainColor = '#00ff66'; label = 'SHD'; }

    const pulse = Math.sin(Date.now() * 0.008) * 3;
    ctx.shadowBlur = 18;
    ctx.shadowColor = mainColor;
    ctx.fillStyle = mainColor;
    ctx.beginPath();
    ctx.arc(0, 0, 13 + pulse, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(0, 0, 8, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#000000';
    ctx.font = '7px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, 0, 1);
    ctx.restore();
}

function drawGoldenSpore(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.shadowBlur = 24;
    ctx.shadowColor = '#ffe600';
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(0, 0, 15 + Math.sin(Date.now() * 0.015) * 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#000';
    ctx.font = '7px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('★', 0, 1);
    ctx.restore();
}

function drawRocket(x, y, angle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    ctx.fillStyle = '#ff9900';
    ctx.beginPath();
    ctx.moveTo(-10, -3);
    ctx.lineTo(-18 - Math.random() * 4, 0);
    ctx.lineTo(-10, 3);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-8, -3, 12, 6);

    ctx.fillStyle = '#ff2222';
    ctx.beginPath();
    ctx.moveTo(4, -3);
    ctx.lineTo(11, 0);
    ctx.lineTo(4, 3);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

// ==========================================
// ENGINE LOOP
// ==========================================
function update() {
    if (shakeTime > 0) shakeTime--;
    if (sectorIntroTimer > 0) sectorIntroTimer--;
    if (shipUnlockAlertTimer > 0) shipUnlockAlertTimer--;
    if (saucer.invulnerableTimer > 0) saucer.invulnerableTimer--;

    if (comboTimer > 0) {
        comboTimer--;
        if (comboTimer <= 0) {
            comboCount = 0;
            comboMultiplier = 1;
        }
    }

    if (state === 'PLAYING' || state === 'BOSS') {
        const sector = SECTORS[currentSectorIdx];
        const ship = SHIPS[selectedShipIdx];

        if (saucer.doubleShotTimer > 0) saucer.doubleShotTimer--;
        if (saucer.speedTimer > 0) saucer.speedTimer--;

        const loopSpeedBoost = (campaignLoop - 1) * 0.5;
        const baseSpeed = 3.6 + Math.min(score / 900, 3.2) + loopSpeedBoost;
        const speedMultiplier = saucer.speedTimer > 0 ? 1.7 : 1.0;
        const currentSpeed = baseSpeed * speedMultiplier;
        const worldDelta = travelDir * currentSpeed;
        scrollOffset += worldDelta;

        const targetScreenX = travelDir === 1 ? WIDTH * 0.32 : WIDTH * 0.68;
        saucer.x += (targetScreenX - saucer.x) * 0.08;
        saucer.currentFacing += (travelDir - saucer.currentFacing) * 0.2;

        stars.forEach(star => {
            star.x -= worldDelta * star.depth;
            if (star.x < 0) star.x += WIDTH;
            if (star.x > WIDTH) star.x -= WIDTH;
        });

        let moveY = 0;
        if (keys['arrowup'] || keys['w'] || touchBtns.up.active) moveY -= 1;
        if (keys['arrowdown'] || keys['s'] || touchBtns.down.active) moveY += 1;

        const vertSpeed = ship.vertSpeed * (saucer.speedTimer > 0 ? 1.4 : 1.0);
        saucer.vy += (moveY * vertSpeed - saucer.vy) * 0.18;
        saucer.y += saucer.vy;

        if (saucer.speedTimer > 0) {
            saucer.ghosts.push({ x: saucer.x, y: saucer.y, alpha: 0.6, facing: saucer.currentFacing, tilt: saucer.vy * 0.05 });
        }
        for (let i = saucer.ghosts.length - 1; i >= 0; i--) {
            saucer.ghosts[i].alpha -= 0.05;
            if (saucer.ghosts[i].alpha <= 0) saucer.ghosts.splice(i, 1);
        }

        saucer.y = Math.max(22, saucer.y);
        const groundUnderSaucer = getForegroundTerrain(saucer.x + scrollOffset);
        if (saucer.y + 12 >= groundUnderSaucer) {
            hitPlayer();
        }

        const baseAngle = travelDir === 1 ? (Math.PI / 5.5) : (Math.PI - Math.PI / 5.5);
        const pitchSwing = saucer.vy * 0.08;
        const rocketAngle = baseAngle + (travelDir === 1 ? pitchSwing : -pitchSwing);

        if (saucer.cooldown > 0) saucer.cooldown--;
        const isFirePressed = keys[' '] || keys['z'] || touchBtns.fire.active;
        if (isFirePressed && saucer.cooldown === 0) {
            const spd = 9.5;
            if (saucer.doubleShotTimer > 0) {
                rockets.push({ x: saucer.x, y: saucer.y + 5, vx: Math.cos(rocketAngle - 0.14) * spd, vy: Math.sin(rocketAngle - 0.14) * spd, angle: rocketAngle - 0.14 });
                rockets.push({ x: saucer.x, y: saucer.y + 5, vx: Math.cos(rocketAngle + 0.14) * spd, vy: Math.sin(rocketAngle + 0.14) * spd, angle: rocketAngle + 0.14 });
            } else {
                rockets.push({ x: saucer.x, y: saucer.y + 5, vx: Math.cos(rocketAngle) * spd, vy: Math.sin(rocketAngle) * spd, angle: rocketAngle });
            }
            playLaser();
            saucer.cooldown = saucer.speedTimer > 0 ? 8 : 13;
        }

        if (state === 'PLAYING') {
            if (Math.random() < 0.035) {
                const spawnX = travelDir === 1 ? scrollOffset + WIDTH + 200 : scrollOffset - 200;
                spawnMushroom(spawnX);
            }
            if (Math.random() < 0.016 && aliens.length < 5) {
                spawnAlien(false);
            }
            checkEliteSpawns();
        }

        if (state === 'BOSS') {
            if (bossWarningTimer > 0) bossWarningTimer--;
            if (boss.flashTimer > 0) boss.flashTimer--;

            const isPhase2 = boss.hp <= 16;
            const isPhase3 = boss.hp <= 8;

            const trackSpeed = isPhase3 ? 0.07 : 0.04;
            boss.worldX += (scrollOffset + (travelDir === 1 ? WIDTH * 0.72 : WIDTH * 0.28) - boss.worldX) * trackSpeed;
            boss.y = boss.baseY + Math.sin(Date.now() * (isPhase3 ? 0.006 : 0.003)) * (isPhase3 ? 45 : 35);
            boss.x = boss.worldX - scrollOffset;

            boss.fireTimer--;
            if (boss.fireTimer <= 0) {
                boss.fireTimer = isPhase3 ? 55 : (isPhase2 ? 70 : 85);
                playBossLaser();

                const eyeX = boss.x + 14;
                const eyeY = boss.y;
                const aimAngle = Math.atan2(saucer.y - eyeY, saucer.x - eyeX);
                const laserSpd = isPhase3 ? 8.0 : 6.5;

                bossBeams.push({ x: eyeX, y: eyeY - 4, vx: Math.cos(aimAngle) * laserSpd, vy: Math.sin(aimAngle) * laserSpd, angle: aimAngle });
                bossBeams.push({ x: eyeX, y: eyeY + 6, vx: Math.cos(aimAngle) * laserSpd, vy: Math.sin(aimAngle) * laserSpd, angle: aimAngle });
            }

            if (isPhase2) {
                boss.sporeTimer--;
                if (boss.sporeTimer <= 0) {
                    boss.sporeTimer = isPhase3 ? 85 : 120;
                    playBoom();
                    triggerShake(4, 5);
                    for (let s = -1; s <= 1; s++) {
                        bossSpores.push({
                            x: boss.x,
                            y: boss.y - 45,
                            vx: s * 2.2 + (Math.random() - 0.5),
                            vy: 2.5 + Math.random() * 1.5,
                            radius: 11
                        });
                    }
                }
            }

            if (Math.hypot(saucer.x - boss.x, saucer.y - boss.y) < boss.radius + ship.hitRadius) {
                hitPlayer();
            }
        }

        for (let i = alienBullets.length - 1; i >= 0; i--) {
            const b = alienBullets[i];
            b.x += b.vx;
            b.y += b.vy;
            if (Math.hypot(saucer.x - b.x, saucer.y - b.y) < ship.hitRadius + 4) {
                hitPlayer();
                alienBullets.splice(i, 1);
                continue;
            }
            if (b.x < -20 || b.x > WIDTH + 20 || b.y < -20 || b.y > HEIGHT + 20) {
                alienBullets.splice(i, 1);
            }
        }

        for (let i = bossBeams.length - 1; i >= 0; i--) {
            const b = bossBeams[i];
            b.x += b.vx;
            b.y += b.vy;

            if (Math.hypot(saucer.x - b.x, saucer.y - b.y) < ship.hitRadius + 6) {
                hitPlayer();
                bossBeams.splice(i, 1);
                continue;
            }
            if (b.x < -40 || b.x > WIDTH + 40 || b.y < -40 || b.y > HEIGHT + 40) {
                bossBeams.splice(i, 1);
            }
        }

        for (let i = bossSpores.length - 1; i >= 0; i--) {
            const sp = bossSpores[i];
            sp.x += sp.vx;
            sp.y += sp.vy;
            sp.vy += 0.05;

            if (Math.hypot(saucer.x - sp.x, saucer.y - sp.y) < sp.radius + ship.hitRadius) {
                createExplosion(sp.x, sp.y, '#ffe600', 14);
                hitPlayer();
                bossSpores.splice(i, 1);
                continue;
            }
            if (sp.y >= getForegroundTerrain(sp.x + scrollOffset) || sp.y > HEIGHT + 30) {
                createExplosion(sp.x, sp.y, '#ffe600', 8);
                bossSpores.splice(i, 1);
            }
        }

        for (let i = goldenSpores.length - 1; i >= 0; i--) {
            const gs = goldenSpores[i];
            gs.y += gs.vy;
            gs.x += Math.sin(Date.now() * 0.005) * 1.5;
            const sx = gs.worldX - scrollOffset;

            if (Math.hypot(saucer.x - sx, saucer.y - gs.y) < 28) {
                score += 1500;
                playPowerupSound('gold');
                triggerShake(10, 12);
                createExplosion(sx, gs.y, '#ffd700', 30);
                aliens.forEach(a => {
                    createExplosion(a.worldX - scrollOffset, a.y, '#00f7ff', 16);
                });
                aliens = [];
                goldenSpores.splice(i, 1);
                continue;
            }
            if (gs.y < -30) goldenSpores.splice(i, 1);
        }

        for (let i = rockets.length - 1; i >= 0; i--) {
            const r = rockets[i];
            r.x += r.vx;
            r.y += r.vy;

            if (r.x < -40 || r.x > WIDTH + 40 || r.y > HEIGHT + 40) {
                rockets.splice(i, 1);
                continue;
            }

            if (r.y >= getForegroundTerrain(r.x + scrollOffset)) {
                createExplosion(r.x, r.y, '#ff6600', 8);
                triggerShake(2.5, 4);
                rockets.splice(i, 1);
                continue;
            }

            let hitGold = false;
            for (let g = goldenSpores.length - 1; g >= 0; g--) {
                const gs = goldenSpores[g];
                const gsx = gs.worldX - scrollOffset;
                if (Math.hypot(r.x - gsx, r.y - gs.y) < 20) {
                    score += 1500;
                    playPowerupSound('gold');
                    triggerShake(10, 12);
                    createExplosion(gsx, gs.y, '#ffd700', 30);
                    goldenSpores.splice(g, 1);
                    rockets.splice(i, 1);
                    hitGold = true;
                    break;
                }
            }
            if (hitGold) continue;

            if (state === 'BOSS') {
                if (Math.hypot(r.x - boss.x, r.y - boss.y) < boss.radius + 8) {
                    boss.hp--;
                    boss.flashTimer = 4;
                    playHit();
                    triggerShake(5, 6);
                    createExplosion(r.x, r.y, '#ffe600', 12);
                    rockets.splice(i, 1);

                    if (boss.hp <= 0) {
                        for (let k = 0; k < 6; k++) {
                            setTimeout(() => {
                                playBoom();
                                triggerShake(15, 18);
                                createExplosion(boss.x + (Math.random() - 0.5) * 60, boss.y + (Math.random() - 0.5) * 60, '#ffe600', 35);
                                createExplosion(boss.x + (Math.random() - 0.5) * 60, boss.y + (Math.random() - 0.5) * 60, '#ff0055', 35);
                            }, k * 180);
                        }
                        registerHitScore(10000);
                        state = 'CLEAR';
                        clearTimer = 220;
                        playSectorClearChime();
                    }
                    continue;
                }
            }

            let hit = false;
            for (let a = aliens.length - 1; a >= 0; a--) {
                const al = aliens[a];
                const ax = al.worldX - scrollOffset;
                if (Math.hypot(r.x - ax, r.y - al.y) < al.radius + 8) {
                    al.hp--;
                    al.flashTimer = 4;
                    playHit();
                    triggerShake(4, 5);

                    if (al.hp <= 0) {
                        createExplosion(ax, al.y, al.isCommander ? '#ff00ff' : '#39ff14', al.isCommander ? 32 : 20);
                        playBoom();
                        triggerShake(8, 10);
                        registerHitScore(al.isCommander ? 400 : 150);

                        if (campaignLoop > 1) {
                            const aimAngle = Math.atan2(saucer.y - al.y, saucer.x - ax);
                            alienBullets.push({ x: ax, y: al.y, vx: Math.cos(aimAngle) * 4.5, vy: Math.sin(aimAngle) * 4.5 });
                        }

                        if (al.isCommander && elitesEliminated < (sector.eliteQuota + (campaignLoop - 1))) {
                            elitesEliminated++;
                            checkSectorClear();
                        }
                        aliens.splice(a, 1);
                    }
                    rockets.splice(i, 1);
                    hit = true;
                    break;
                }
            }
            if (hit) continue;

            for (let j = mushrooms.length - 1; j >= 0; j--) {
                const m = mushrooms[j];
                const screenX = m.worldX - scrollOffset;
                if (Math.hypot(r.x - screenX, r.y - (m.y - 8)) < m.radius + 10) {
                    m.hp--;
                    m.flashTimer = 4;
                    playHit();
                    triggerShake(4, 5);

                    if (m.hp <= 0) {
                        createExplosion(screenX, m.y - 8, m.capColor, m.isMega ? 35 : 20);
                        if (m.isMega) playBoom();
                        registerHitScore(m.isMega ? 500 : 50);

                        if (!m.isMega && Math.random() < 0.12 && goldenSpores.length === 0) {
                            goldenSpores.push({ worldX: m.worldX, y: m.y - 20, vy: -2.2 });
                        }

                        if (m.isMega) {
                            if (elitesEliminated < (sector.eliteQuota + (campaignLoop - 1))) {
                                elitesEliminated++;
                                checkSectorClear();
                            }
                        } else {
                            if (shroomsEliminated < (sector.shroomQuota + (campaignLoop - 1) * 3)) {
                                shroomsEliminated++;
                                checkSectorClear();
                            }
                        }

                        if (m.type !== 'normal' && !m.isMega) {
                            powerups.push({ worldX: m.worldX, y: m.y - 15, vy: -1.2, type: m.type });
                        }
                        mushrooms.splice(j, 1);
                    }
                    rockets.splice(i, 1);
                    break;
                }
            }
        }

        for (let i = aliens.length - 1; i >= 0; i--) {
            const al = aliens[i];
            if (al.flashTimer > 0) al.flashTimer--;
            al.worldX += al.vx;
            al.y = al.baseY + Math.sin(Date.now() * 0.004 + al.bobOffset) * 16;
            const ax = al.worldX - scrollOffset;

            if (Math.hypot(saucer.x - ax, saucer.y - al.y) < al.radius + ship.hitRadius) {
                hitPlayer();
            }
            if (Math.abs(al.worldX - scrollOffset) > WIDTH * 1.9) {
                aliens.splice(i, 1);
            }
        }

        mushrooms.forEach(m => {
            if (m.flashTimer > 0) m.flashTimer--;
        });

        for (let i = powerups.length - 1; i >= 0; i--) {
            const p = powerups[i];
            p.y += p.vy;
            const px = p.worldX - scrollOffset;

            if (Math.hypot(saucer.x - px, saucer.y - p.y) < 28) {
                if (p.type === 'speed') {
                    saucer.speedTimer = 500;
                    playPowerupSound('speed');
                } else if (p.type === 'double') {
                    saucer.doubleShotTimer = 550;
                    playPowerupSound('double');
                } else if (p.type === 'shield') {
                    saucer.shieldActive = true;
                    playPowerupSound('shield');
                }
                registerHitScore(250);
                powerups.splice(i, 1);
                continue;
            }
            if (p.y < 30) powerups.splice(i, 1);
        }

        mushrooms = mushrooms.filter(m => Math.abs(m.worldX - scrollOffset) < WIDTH * 1.8);

    } else if (state === 'CLEAR') {
        clearTimer--;

        if (clearTimer === 100 && currentSectorIdx + 1 < SECTORS.length) {
            playWarpSound();
        }

        stars.forEach(star => {
            star.x -= (clearTimer < 100 ? 28 : 5) * star.depth;
            if (star.x < 0) star.x += WIDTH;
        });

        if (clearTimer <= 0) {
            if (currentSectorIdx + 1 < SECTORS.length) {
                loadSector(currentSectorIdx + 1);
                state = 'PLAYING';
            } else {
                state = 'VICTORY';
            }
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.alpha -= pt.decay;
        if (pt.alpha <= 0) particles.splice(i, 1);
    }
}

function checkSectorClear() {
    const sector = SECTORS[currentSectorIdx];
    const neededShrooms = sector.shroomQuota + (campaignLoop - 1) * 3;
    const neededElites = sector.eliteQuota + (campaignLoop - 1);

    if (shroomsEliminated >= neededShrooms && elitesEliminated >= neededElites) {
        if (sector.hasBoss && state !== 'BOSS') {
            startBossEncounter();
        } else if (!sector.hasBoss) {
            state = 'CLEAR';
            clearTimer = 180;
            registerHitScore(2500);
            playSectorClearChime();
            triggerShake(12, 16);
        }
    }
}

function triggerGameOver() {
    const lowest = leaderboard[leaderboard.length - 1].score;
    if (score > lowest) {
        state = 'INITIALS';
        entryLetters = ['A', 'A', 'A'];
        entryPos = 0;
    } else {
        state = 'GAMEOVER';
    }
}

function handleInitialsInput(k) {
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!?.- ";
    let idx = alphabet.indexOf(entryLetters[entryPos]);

    if (k === 'arrowup' || k === 'w') {
        idx = (idx + 1) % alphabet.length;
        entryLetters[entryPos] = alphabet[idx];
        playLaser();
    } else if (k === 'arrowdown' || k === 's') {
        idx = (idx - 1 + alphabet.length) % alphabet.length;
        entryLetters[entryPos] = alphabet[idx];
        playLaser();
    } else if (k === ' ' || k === 'enter' || k === 'z') {
        playHit();
        entryPos++;
        if (entryPos > 2) {
            leaderboard.push({
                initials: entryLetters.join(''),
                score: score,
                loop: campaignLoop
            });
            leaderboard.sort((a, b) => b.score - a.score);
            leaderboard = leaderboard.slice(0, 5);
            saveLeaderboard();
            state = 'GAMEOVER';
        }
    }
}

// ==========================================
// RENDER PIPELINE
// ==========================================
function draw() {
    ctx.save();
    if (shakeTime > 0) {
        ctx.translate((Math.random() - 0.5) * shakeStrength, (Math.random() - 0.5) * shakeStrength);
    }

    const sector = SECTORS[currentSectorIdx];

    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    const isWarping = state === 'CLEAR' && clearTimer < 100 && currentSectorIdx + 1 < SECTORS.length;
    stars.forEach(star => {
        ctx.fillStyle = '#ffffff';
        if (isWarping) {
            ctx.fillRect(star.x, star.y, star.size * 14, 1.5);
        } else {
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        }
    });

    if (state === 'START') {
        const t = Date.now() * 0.003;
        const pulseColor = Math.sin(t * 3) > 0 ? '#ff007f' : '#00f7ff';
        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = '36px "Press Start 2P"';
        ctx.fillStyle = pulseColor;
        ctx.shadowBlur = 25;
        ctx.shadowColor = pulseColor;
        ctx.fillText('BLOB BUSTERS', WIDTH / 2, 95);

        ctx.font = '11px "Press Start 2P"';
        ctx.fillStyle = '#ffe600';
        ctx.shadowColor = '#ffe600';
        ctx.fillText('MASTER DELUXE EDITION', WIDTH / 2, 132);

        ctx.font = '10px "Press Start 2P"';
        ctx.fillStyle = '#00f7ff';
        ctx.shadowBlur = 0;
        ctx.fillText('★ HIGH SCORE HALL OF FAME ★', WIDTH / 2, 178);

        leaderboard.forEach((entry, idx) => {
            ctx.fillStyle = idx === 0 ? '#ffe600' : '#fff';
            const rank = `${idx + 1}. ${entry.initials} ..... ${entry.score.toString().padStart(6, '0')} (LP ${entry.loop || 1})`;
            ctx.fillText(rank, WIDTH / 2, 208 + idx * 24);
        });

        const blink = Math.sin(Date.now() * 0.012) > 0;
        if (blink) {
            ctx.font = '12px "Press Start 2P"';
            ctx.fillStyle = '#00ff66';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00ff66';
            ctx.fillText(isTouchDevice ? 'TAP TO START GAME' : 'PRESS [SPACE] TO PLAY', WIDTH / 2, 380);
        }

        ctx.font = '10px "Press Start 2P"';
        ctx.fillStyle = '#ff00aa';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#ff00aa';
        ctx.fillText(`[H] HANGAR: ${SHIPS[selectedShipIdx].name}`, WIDTH / 2, 420);

        if (hasUnviewedShip) {
            const alertBlink = Math.sin(Date.now() * 0.018) > 0;
            if (alertBlink) {
                ctx.font = '9px "Press Start 2P"';
                ctx.fillStyle = '#ffe600';
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ffe600';
                ctx.fillText('★ NEW SHIP AVAILABLE! PRESS [H] ★', WIDTH / 2, 448);
            }
        }

        ctx.restore();
        ctx.restore();
        return;
    }

    if (state === 'HANGAR') {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = '22px "Press Start 2P"';
        ctx.fillStyle = '#00f7ff';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00f7ff';
        ctx.fillText('SHIP HANGAR', WIDTH / 2, 70);

        const currentShip = SHIPS[selectedShipIdx];
        ctx.font = '14px "Press Start 2P"';
        ctx.fillStyle = currentShip.unlocked ? '#00ff66' : '#ff0033';
        ctx.fillText(`◀  ${currentShip.name}  ▶`, WIDTH / 2, 130);

        drawSaucer(WIDTH / 2, 230, 2.0, Math.sin(Date.now() * 0.003) * 0.06);

        ctx.font = '10px "Press Start 2P"';
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 0;
        ctx.fillText(currentShip.desc, WIDTH / 2, 330);
        ctx.fillText(`LIVES: ${currentShip.lives} | HITBOX: ${currentShip.hitRadius}px`, WIDTH / 2, 360);

        if (!currentShip.unlocked) {
            ctx.fillStyle = '#ffe600';
            const req = currentShip.id === 'dart' ? 'UNLOCK REQUIREMENT: 10,000 PTS' : 'UNLOCK REQUIREMENT: 25,000 PTS';
            ctx.fillText(req, WIDTH / 2, 400);
        } else {
            ctx.fillStyle = '#00ff66';
            ctx.fillText('STATUS: READY FOR FLIGHT', WIDTH / 2, 400);
        }

        ctx.fillStyle = '#888';
        ctx.fillText('PRESS [SPACE] TO LAUNCH | [ESC] / [H] EXIT', WIDTH / 2, 450);
        ctx.restore();
        ctx.restore();
        return;
    }

    if (state === 'INITIALS') {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = '24px "Press Start 2P"';
        ctx.fillStyle = '#ffe600';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#ffe600';
        ctx.fillText('NEW HIGH SCORE!', WIDTH / 2, 110);

        ctx.font = '14px "Press Start 2P"';
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 0;
        ctx.fillText(`SCORE: ${score}`, WIDTH / 2, 160);
        ctx.fillText('ENTER YOUR INITIALS', WIDTH / 2, 200);

        for (let i = 0; i < 3; i++) {
            const lx = WIDTH / 2 - 60 + i * 60;
            const isSelected = i === entryPos;
            ctx.font = '32px "Press Start 2P"';
            ctx.fillStyle = isSelected ? '#00f7ff' : '#666';
            ctx.fillText(entryLetters[i], lx, 280);

            if (isSelected && Math.floor(Date.now() / 150) % 2 === 0) {
                ctx.fillRect(lx - 16, 295, 32, 4);
            }
        }

        ctx.font = '9px "Press Start 2P"';
        ctx.fillStyle = '#aaa';
        ctx.fillText('UP/DOWN: CHANGE LETTER | SPACE: CONFIRM', WIDTH / 2, 380);
        ctx.restore();
        ctx.restore();
        return;
    }

    ctx.beginPath();
    ctx.moveTo(0, HEIGHT);
    for (let sx = 0; sx <= WIDTH; sx += 16) {
        const wx = sx + scrollOffset * 0.4;
        ctx.lineTo(sx, getBackgroundMountain(wx));
    }
    ctx.lineTo(WIDTH, HEIGHT);
    ctx.closePath();
    ctx.fillStyle = sector.mountainCol;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(0, HEIGHT);
    for (let sx = 0; sx <= WIDTH; sx += 10) {
        const wx = sx + scrollOffset;
        ctx.lineTo(sx, getForegroundTerrain(wx));
    }
    ctx.lineTo(WIDTH, HEIGHT);
    ctx.closePath();

    const rockGrad = ctx.createLinearGradient(0, HEIGHT - 180, 0, HEIGHT);
    rockGrad.addColorStop(0, sector.rockTop);
    rockGrad.addColorStop(0.3, sector.rockMid);
    rockGrad.addColorStop(1, sector.rockBot);
    ctx.fillStyle = rockGrad;
    ctx.fill();

    const groundUnderSaucer = getForegroundTerrain(saucer.x + scrollOffset);
    const altitude = groundUnderSaucer - (saucer.y + 12);
    const isTerrainWarning = altitude < 42 && state !== 'CLEAR';

    ctx.lineWidth = 3;
    ctx.strokeStyle = isTerrainWarning && (Math.floor(Date.now() / 80) % 2 === 0) ? '#ff0033' : sector.rockEdge;
    ctx.stroke();

    mushrooms.forEach(m => {
        const sx = m.worldX - scrollOffset;
        if (sx >= -50 && sx <= WIDTH + 50) {
            drawMushroom(sx, m.y, m.scale, m.capColor, m.stemColor, m.type, m.isMega, m.flashTimer, m.hp);
        }
    });

    aliens.forEach(al => {
        const ax = al.worldX - scrollOffset;
        if (ax >= -60 && ax <= WIDTH + 60) {
            drawAlien(ax, al.y, al.isCommander, al.flashTimer, al.hp);
        }
    });

    if (state === 'BOSS' || (state === 'CLEAR' && sector.hasBoss && clearTimer > 150)) {
        drawCyberSovereign(boss.x, boss.y, boss.flashTimer, 1.0);
    }

    bossBeams.forEach(b => {
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.angle);
        ctx.fillStyle = '#ff0033';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff0033';
        ctx.fillRect(-14, -2, 28, 5);
        ctx.restore();
    });

    bossSpores.forEach(sp => {
        ctx.save();
        ctx.shadowBlur = 14;
        ctx.shadowColor = '#ffe600';
        ctx.fillStyle = '#ff0055';
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, sp.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });

    alienBullets.forEach(ab => {
        ctx.fillStyle = '#ff00ff';
        ctx.beginPath();
        ctx.arc(ab.x, ab.y, 4, 0, Math.PI * 2);
        ctx.fill();
    });

    goldenSpores.forEach(gs => {
        const gsx = gs.worldX - scrollOffset;
        drawGoldenSpore(gsx, gs.y);
    });

    powerups.forEach(p => {
        const px = p.worldX - scrollOffset;
        drawPowerupOrb(px, p.y, p.type);
    });

    rockets.forEach(r => {
        drawRocket(r.x, r.y, r.angle);
    });

    saucer.ghosts.forEach(g => {
        ctx.save();
        ctx.globalAlpha = g.alpha * 0.4;
        drawSaucer(g.x, g.y, g.facing, g.tilt);
        ctx.restore();
    });

    if (state === 'PLAYING' || state === 'BOSS' || state === 'CLEAR') {
        drawSaucer(saucer.x, saucer.y, saucer.currentFacing, saucer.vy * 0.05);

        if (state === 'PLAYING') {
            let offscreenEliteX = null;
            if (sector.eliteType === 'megashroom') {
                const activeMega = mushrooms.find(m => m.isMega);
                if (activeMega) offscreenEliteX = activeMega.worldX - scrollOffset;
            } else {
                const activeCmd = aliens.find(a => a.isCommander);
                if (activeCmd) offscreenEliteX = activeCmd.worldX - scrollOffset;
            }

            if (offscreenEliteX !== null && (offscreenEliteX < 0 || offscreenEliteX > WIDTH)) {
                const pointLeft = offscreenEliteX < 0;
                const blink = Math.sin(Date.now() * 0.015) > 0;
                if (blink) {
                    ctx.save();
                    ctx.fillStyle = '#ff0033';
                    ctx.font = '8px "Press Start 2P"';
                    ctx.textAlign = pointLeft ? 'right' : 'left';
                    const arrowTxt = pointLeft ? '◀ ELITE' : 'ELITE ▶';
                    ctx.fillText(arrowTxt, saucer.x + (pointLeft ? -42 : 42), saucer.y - 12);
                    ctx.restore();
                }
            }
        }
    }

    particles.forEach(pt => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, pt.alpha);
        ctx.fillStyle = pt.color;
        ctx.shadowBlur = 6;
        ctx.shadowColor = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });

    ctx.shadowBlur = 0;
    ctx.font = '11px "Press Start 2P"';
    ctx.textAlign = 'left';

    const loopTag = campaignLoop > 1 ? ` (LOOP ${campaignLoop})` : '';
    ctx.fillStyle = '#00f7ff';
    ctx.fillText(`SECTOR: ${currentSectorIdx + 1}/5${loopTag}`, 25, 24);
    ctx.fillStyle = '#ff007f';
    ctx.fillText(`${sector.name}`, 25, 42);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(`PTS:${score}`, 25, 60);

    if (comboMultiplier > 1) {
        ctx.save();
        ctx.font = '12px "Press Start 2P"';
        ctx.fillStyle = '#ffe600';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ffe600';
        ctx.fillText(`COMBO x${comboMultiplier}!`, 180, 60);
        ctx.restore();
    }

    ctx.fillStyle = '#ffe600';
    ctx.fillText('LIVES:', 25, 80);
    for (let l = 0; l < lives; l++) {
        ctx.save();
        ctx.translate(95 + l * 26, 75);
        ctx.fillStyle = '#ff00aa';
        ctx.beginPath();
        ctx.ellipse(0, 0, 10, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#00ffff';
        ctx.beginPath();
        ctx.arc(0, -2, 4, Math.PI, 0);
        ctx.fill();
        ctx.restore();
    }

    const targetShrooms = sector.shroomQuota + (campaignLoop - 1) * 3;
    const targetElites = sector.eliteQuota + (campaignLoop - 1);
    if (state === 'BOSS') {
        const isPhase2 = boss.hp <= 16;
        const isPhase3 = boss.hp <= 8;
        const phaseName = isPhase3 ? 'ENRAGED!' : (isPhase2 ? 'BARRAGE' : 'DUAL BEAM');
        ctx.fillStyle = isPhase3 ? '#ff0033' : '#ffe600';
        ctx.fillText(`SOVEREIGN [${phaseName}]`, 25, 104);
        const barWidth = 190;
        const hpPercent = Math.max(0, boss.hp / boss.maxHp);
        ctx.fillStyle = '#333';
        ctx.fillRect(25, 114, barWidth, 12);
        ctx.fillStyle = boss.flashTimer > 0 ? '#fff' : (isPhase3 ? '#ff0033' : '#ff0055');
        ctx.fillRect(25, 114, barWidth * hpPercent, 12);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(25, 114, barWidth, 12);
    } else {
        ctx.fillStyle = shroomsEliminated >= targetShrooms ? '#00ff66' : '#ffe600';
        ctx.fillText(`SHROOMS:${shroomsEliminated}/${targetShrooms}`, 25, 102);

        const eliteLabel = sector.eliteType === 'megashroom' ? 'MEGAS' : 'CMDRS';
        ctx.fillStyle = elitesEliminated >= targetElites ? '#00ff66' : '#ff0055';
        ctx.fillText(`${eliteLabel}:${elitesEliminated}/${targetElites}`, 25, 120);
    }

    ctx.fillStyle = '#00ffcc';
    ctx.fillText(`${travelDir === 1 ? 'EAST >' : '< WEST'}`, 360, 42);

    if (saucer.shieldActive) {
        ctx.fillStyle = '#00ff66';
        ctx.fillText('SHIELD: ACTIVE', 500, 42);
    } else if (saucer.doubleShotTimer > 0) {
        ctx.fillStyle = '#ffe600';
        ctx.fillText(`2X:${Math.ceil(saucer.doubleShotTimer / 60)}s`, 500, 42);
    }
    if (saucer.speedTimer > 0) {
        ctx.fillStyle = '#00f7ff';
        ctx.fillText(`SPD:${Math.ceil(saucer.speedTimer / 60)}s`, 660, 42);
    }

    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffe600';
    ctx.fillText('RECORD', WIDTH - 30, 24);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(`${leaderboard[0].score}`, WIDTH - 30, 42);

    if (isTerrainWarning) {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = '10px "Press Start 2P"';
        ctx.fillStyle = '#ff0033';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#ff0033';
        ctx.fillText('▲ WARNING: LOW ALTITUDE ▲', WIDTH / 2, 70);
        ctx.restore();
    }

    if (shipUnlockAlertTimer > 0) {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 85, WIDTH, 48);

        ctx.strokeStyle = '#ffe600';
        ctx.lineWidth = 2;
        ctx.strokeRect(0, 85, WIDTH, 48);

        ctx.font = '12px "Press Start 2P"';
        ctx.fillStyle = '#ffe600';
        ctx.shadowBlur = 14;
        ctx.shadowColor = '#ffe600';
        ctx.fillText(`★ NEW SHIP UNLOCKED: ${unlockedShipName}! ★`, WIDTH / 2, 105);

        ctx.font = '9px "Press Start 2P"';
        ctx.fillStyle = '#00ff66';
        ctx.shadowBlur = 0;
        ctx.fillText('READY TO FLY IN HANGAR [H]', WIDTH / 2, 122);
        ctx.restore();
    }

    if (state === 'PLAYING' && sectorIntroTimer > 0) {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, HEIGHT / 2 - 60, WIDTH, 120);

        ctx.strokeStyle = '#00f7ff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, HEIGHT / 2 - 60); ctx.lineTo(WIDTH, HEIGHT / 2 - 60);
        ctx.moveTo(0, HEIGHT / 2 + 60); ctx.lineTo(WIDTH, HEIGHT / 2 + 60);
        ctx.stroke();

        ctx.font = '22px "Press Start 2P"';
        ctx.fillStyle = '#00f7ff';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00f7ff';
        ctx.fillText(`SECTOR ${currentSectorIdx + 1}${loopTag}`, WIDTH / 2, HEIGHT / 2 - 16);

        ctx.font = '16px "Press Start 2P"';
        ctx.fillStyle = '#ffe600';
        ctx.shadowColor = '#ffe600';
        ctx.fillText(`${sector.name}`, WIDTH / 2, HEIGHT / 2 + 16);

        ctx.font = '9px "Press Start 2P"';
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 0;
        ctx.fillText('MISSION: BUST ALL BLOBS', WIDTH / 2, HEIGHT / 2 + 42);
        ctx.restore();
    }

    if (state === 'BOSS' && bossWarningTimer > 0) {
        const blink = Math.sin(Date.now() * 0.02) > 0;
        if (blink) {
            drawCenterText('WARNING! HIVE SOVEREIGN', 16, '#ff0033', -120);
        }
    }

    if (state === 'CLEAR') {
        drawCenterText(sector.hasBoss ? 'SOVEREIGN DESTROYED!' : 'SECTOR CLEARED!', 22, '#00ff66', -30);
        drawCenterText(sector.hasBoss ? '+10,000 BONUS PTS' : '+2500 BONUS POINTS', 12, '#ffe600', 10);
        if (currentSectorIdx + 1 < SECTORS.length) {
            drawCenterText(`WARPING TO SECTOR ${currentSectorIdx + 2}...`, 12, '#00ffff', 48);
        }
    } else if (state === 'GAMEOVER') {
        drawCenterText('MISSION FAILED!', 26, '#ff0055', -50);
        drawCenterText(`SCORE: ${score}`, 12, '#ffffff', -15);
        drawCenterText('[C] CONTINUE AT SECTOR ' + (currentSectorIdx + 1), 12, '#00ff66', 22);
        drawCenterText('[SPACE] RESTART FROM SECTOR 1', 10, '#888899', 50);

        if (hasUnviewedShip) {
            const alertBlink = Math.sin(Date.now() * 0.018) > 0;
            if (alertBlink) {
                drawCenterText('★ NEW SHIP UNLOCKED! PRESS [H] FOR HANGAR ★', 10, '#ffe600', 80);
            }
        }
    } else if (state === 'VICTORY') {
        drawCenterText('SOVEREIGN DEFEATED!', 22, '#00ffcc', -45);
        drawCenterText(`LOOP ${campaignLoop} CLEARED! SCORE: ${score}`, 12, '#ffe600', -10);
        drawCenterText('PRESS [SPACEBAR] TO ENTER OVERDRIVE LOOP ' + (campaignLoop + 1), 10, '#ff007f', 35);
    }

    if (isTouchDevice && (state === 'PLAYING' || state === 'BOSS')) {
        ctx.save();
        for (const k in touchBtns) {
            const b = touchBtns[k];
            ctx.fillStyle = b.active ? 'rgba(0, 247, 255, 0.45)' : 'rgba(255, 255, 255, 0.12)';
            ctx.strokeStyle = b.active ? '#00f7ff' : 'rgba(255, 255, 255, 0.35)';
            ctx.lineWidth = 2;
            if (k === 'fire') {
                ctx.beginPath();
                ctx.arc(b.x + b.w / 2, b.y + b.h / 2, b.w / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            } else {
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.strokeRect(b.x, b.y, b.w, b.h);
            }
            ctx.fillStyle = '#ffffff';
            ctx.font = (k === 'fire' ? '12px' : '10px') + ' "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
        }
        ctx.restore();
    }

    ctx.restore();
}

function drawCenterText(text, size, color, yOffset) {
    ctx.save();
    ctx.font = `${size}px "Press Start 2P"`;
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    ctx.fillText(text, WIDTH / 2, HEIGHT / 2 + yOffset);
    ctx.restore();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
